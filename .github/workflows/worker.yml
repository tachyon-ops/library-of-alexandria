name: Research Worker

on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: research-worker
  cancel-in-progress: false

permissions:
  contents: read
  models: read

jobs:
  drain:
    name: Drain Postgres job queue
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || (secrets.ANTHROPIC_API_KEY && 'anthropic') || 'gemini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
      MODEL_TAXONOMIST: ${{ secrets.MODEL_TAXONOMIST }}
      MODEL_SCOUT: ${{ secrets.MODEL_SCOUT }}
      MODEL_READER: ${{ secrets.MODEL_READER }}
      MODEL_SKEPTIC: ${{ secrets.MODEL_SKEPTIC }}
      MODEL_WEB: ${{ secrets.MODEL_WEB }}
    steps:
      - name: Check secrets configured
        id: check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not configured yet; skipping worker drain."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.ready == 'true'
        run: npm ci

      - name: Verify non-destructive migration & seed gates
        if: steps.check.outputs.ready == 'true'
        run: npm run db:verify-safe

      - name: Capture compressed pre-migration logical database dump
        if: steps.check.outputs.ready == 'true'
        run: npm run db:backup

      - name: Upload pre-migration database backup artifact
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pre-migration-db-backup-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 30
          if-no-files-found: error

      - name: Migrate and seed database (idempotent, additive-only)
        if: steps.check.outputs.ready == 'true'
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Drain queued research jobs
        if: steps.check.outputs.ready == 'true'
        run: npm run drain:worker

